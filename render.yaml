# ==============================================================================
# ImpEx AI — Render Blueprint (Unified 1-Click All-in-One Deployment)
# Deploys Next.js Frontend + FastAPI Backend + Real Buyers DB as ONE Free Service
# Gives you 1 single live temporary domain: https://impex-ai.onrender.com
# ==============================================================================
version: "1"

services:
  - type: web
    name: impex-ai
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false # Enter your key in Render dashboard (optional)
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USE_SSL
        value: "True"
      - key: SMTP_USER
        sync: false # Hostinger business email (optional)
      - key: SMTP_PASSWORD
        sync: false # Hostinger email password (optional)
