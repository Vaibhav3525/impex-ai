# ==============================================================================
# ImpEx AI — Render Blueprint (Monorepo 1-Click Deployment)
# Deploys both FastAPI Backend and Next.js Frontend together from 1 repository
# ==============================================================================
version: "1"

services:
  # 1. FastAPI Python Backend Service (Free Tier)
  - type: web
    name: impex-backend
    env: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/seed_verified_real_buyers.py
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./impex_leads.db
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USE_SSL
        value: "True"
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard

  # 2. Next.js Frontend Static Site (100% Free Forever)
  - type: web
    name: impex-frontend
    env: static
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: impex-backend
          property: host
