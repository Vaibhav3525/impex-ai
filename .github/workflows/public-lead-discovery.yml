name: Public lead discovery

permissions: {}

on:
  workflow_dispatch:

concurrency:
  group: public-lead-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run evidence-backed discovery
        env:
          DISCOVERY_TRIGGER_TOKEN: ${{ secrets.DISCOVERY_TRIGGER_TOKEN }}
        run: |
          if [ -z "$DISCOVERY_TRIGGER_TOKEN" ]; then
            echo "::error::Configure the DISCOVERY_TRIGGER_TOKEN in GitHub Actions and Render."
            exit 1
          fi
          result="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 20 --max-time 150 \
            -X POST \
            -H "Authorization: Bearer $DISCOVERY_TRIGGER_TOKEN" \
            "https://impex-ai.onrender.com/api/v1/discover/public-sources/run")"
          printf '%s\n' "$result"
          jq -e '.status == "Completed" or .status == "Completed with source errors"' <<< "$result" >/dev/null
